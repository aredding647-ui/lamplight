<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings · Lamplight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/lamplight.css">
<style>
  .navlinks a[aria-current="page"] { background: var(--hl-yellow); color: #141414; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--ink); background: var(--hl-pink); color: #141414; display: grid; place-items: center; font: 800 17px var(--font-display); text-decoration: none; box-shadow: 0 3px 0 var(--shadow); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
  .pagefoot { margin-top: 80px; border-top: 2px solid var(--ink); padding-block: 24px 40px; color: var(--muted); font-size: 14px; }

  .top { margin-top: 34px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .top .big { width: 72px; height: 72px; border-radius: 20px; border: 2.5px solid var(--ink); background: var(--hl-pink); color: #141414; display: grid; place-items: center; font: 800 34px var(--font-display); box-shadow: 0 4px 0 var(--shadow); transform: rotate(-3deg); }
  .top .hand { font-size: 24px; color: var(--muted); display: block; transform: rotate(-2deg); }
  .top h1 { font-size: clamp(40px, 6vw, 72px); letter-spacing: -0.045em; }
  .top p { margin: 4px 0 0; color: var(--ink-2); }

  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; margin-top: 30px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .snav { position: sticky; top: 100px; display: grid; gap: 4px; }
  @media (max-width: 860px) { .snav { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: none; } .snav::-webkit-scrollbar { display: none; } }
  .snav a { text-decoration: none; font-weight: 700; font-size: 15px; padding: 10px 14px; border-radius: 12px; color: var(--ink-2); border: 2px solid transparent; white-space: nowrap; }
  .snav a:hover { background: var(--paper-2); }
  .snav a[aria-current="true"] { background: var(--card); border-color: var(--ink); color: var(--ink); box-shadow: 0 3px 0 var(--shadow); }

  .sec { background: var(--card); border: 2.5px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--shadow); padding: 28px; margin-bottom: 24px; scroll-margin-top: 100px; }
  @media (max-width: 600px) { .sec { padding: 20px; } }
  .sec h2 { font-size: 28px; letter-spacing: -0.035em; }
  .sec .lead { margin: 6px 0 20px; color: var(--ink-2); font-size: 15.5px; }
  .rows { display: grid; gap: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .field select, .field input { font: 600 16.5px var(--font-body); padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--ink); }
  .field input[readonly] { color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-b { min-width: 48px; padding: 10px 14px; border-radius: 11px; border: 2px solid var(--line); background: var(--paper); font-weight: 700; cursor: pointer; color: var(--ink); }
  .chip-b[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border-radius: 14px; background: var(--paper); border: 2px solid var(--line); cursor: pointer; }
  .toggle b { display: block; font-size: 15.5px; } .toggle small { color: var(--muted); font-size: 13.5px; }
  .sw { flex: none; width: 46px; height: 26px; border-radius: 99px; background: var(--line); position: relative; border: 0; cursor: pointer; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); transition: left .15s; }
  .sw[aria-checked="true"] { background: var(--ink); } .sw[aria-checked="true"]::after { left: 23px; }
  .note { font-size: 13.5px; color: var(--muted); margin: 0; }

  .subs { display: grid; gap: 12px; }
  .subcard { border: 2px solid var(--line); border-radius: 18px; background: var(--paper); padding: 16px; display: grid; gap: 14px; }
  .subcard .hd { display: flex; align-items: center; gap: 12px; }
  .subcard .hd i { flex: none; width: 16px; height: 40px; border-radius: 6px; border: 2px solid var(--ink); background: var(--c); }
  .subcard .hd b { font-size: 17px; } .subcard .hd small { display: block; font: 700 12px var(--font-mono); color: var(--muted); }
  .subcard .hd .edit { margin-left: auto; }
  .subcard .body { display: grid; gap: 14px; }
  .swatches { display: flex; gap: 8px; }
  .swatch { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); cursor: pointer; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 3px 0 var(--shadow); }
  .rowbtns { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .linkish { border: 0; background: none; padding: 0; font: 600 14.5px var(--font-body); color: var(--ink-2); text-decoration: underline; cursor: pointer; }
  .linkish.danger { color: var(--bad); }

  .status { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border: 2px solid var(--line); border-radius: 16px; background: var(--paper); }
  .status i { flex: none; width: 16px; height: 16px; border-radius: 99px; border: 2px solid var(--ink); background: var(--good); }
  .status[data-s="syncing"] i { background: var(--hl-yellow); } .status[data-s="error"] i, .status[data-s="off"] i { background: var(--bad); }
  .status b { display: block; font-size: 16px; } .status small { color: var(--muted); font-size: 14px; }
  .msg { margin: 0; font-weight: 600; font-size: 15px; padding: 12px 14px; border-radius: 12px; }
  .msg.bad { color: var(--bad); background: var(--bad-soft); } .msg.good { color: var(--good); background: var(--good-soft); }
  .form { display: grid; gap: 16px; max-width: 440px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--paper); font-weight: 700; padding: 11px 18px; border-radius: 12px; transition: all .2s; z-index: 95; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 820px) { .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); } }
</style>
<script src="js/config.js"></script>
<script src="js/sync.js"></script>
<script src="js/menu.js"></script>
</head>
<body class="app">

<header class="topbar">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="index.html" aria-label="Lamplight home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 14 16 4l8 10Z" fill="var(--hl-yellow)" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 17 5 29h22l-6-12Z" fill="var(--hl-yellow)" opacity=".45"/><circle cx="16" cy="15.5" r="2" fill="var(--ink)"/></svg>
        Lamplight
      </a>
      <nav class="navlinks" aria-label="Main">
        <a href="dashboard.html" data-nav="home">Home</a>
        <a href="subject.html" data-nav="learning">Learning</a>
        <a href="diagnostic.html">Diagnostic</a>
        <a href="analytics.html">Analytics</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" type="button" id="lights" aria-label="Turn lights off" title="Lights off">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        </button>
        <a class="avatar" href="account.html" aria-label="Your account">S</a>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <section class="top"><span class="big" id="bigA">A</span><div><span class="hand">your account</span><h1>Settings</h1><p id="topLine"></p></div></section>
  <div class="layout">
    <nav class="snav" id="snav" aria-label="Settings sections">
      <a href="#profile">Profile</a><a href="#study">Study and bedtime</a><a href="#subjects">My subjects</a><a href="#appearance">Appearance</a><a href="#account">Account</a><a href="#data">Your data</a>
    </nav>
    <div>
      <section class="sec" id="profile"></section>
      <section class="sec" id="study"></section>
      <section class="sec" id="subjects"></section>
      <section class="sec" id="appearance"></section>
      <section class="sec" id="account" aria-live="polite"></section>
      <section class="sec" id="data"></section>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<footer class="pagefoot"><div class="wrap">Changes save straight away, on this device first and then to your account.</div></footer>

<script src="data/units.js"></script>
<script src="js/banks.js"></script>
<script src="js/account.js"></script>
<script src="js/subnav.js"></script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const read = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const S = window.LamplightSync, L = window.Lamplight || {};
  const prof = () => read('lamplight:profile', {}) || {};
  let tt; const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1800); };
  const saveProf = (patch, msg) => { write('lamplight:profile', Object.assign({}, prof(), patch)); toast(msg || 'Saved'); top(); };
  const chips = (key, vals, cur, label) => '<div class="chips" data-chips="' + key + '">' + vals.map(v => '<button type="button" class="chip-b" data-v="' + esc(v) + '" aria-pressed="' + (String(cur) === String(v)) + '">' + esc(label ? label(v) : v) + '</button>').join('') + '</div>';
  const t12 = t => { const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h >= 12 && h < 24 ? ' pm' : ' am'); };
  const COLOURS = [['Yellow', 'var(--hl-yellow)'], ['Pink', 'var(--hl-pink)'], ['Blue', 'var(--hl-blue)'], ['Green', 'var(--hl-green)'], ['Orange', 'var(--hl-orange)']];

  function top() {
    const p = prof(), name = String(p.name || '').trim();
    $('#bigA').textContent = (name || 'L')[0].toUpperCase();
    const info = S ? S.info() : { signedIn: false };
    $('#topLine').textContent = (name ? name + ' · ' : '') + (info.signedIn ? info.email : 'not signed in');
    document.querySelectorAll('a.avatar').forEach(a => { if (name) a.textContent = name[0].toUpperCase(); });
  }

  /* ---------- profile ---------- */
  function profile() {
    const p = prof();
    $('#profile').innerHTML = '<h2>Profile</h2><p class="lead">How Lamplight greets you, and what you\'re studying.</p><div class="rows">' +
      '<label class="field"><span>Name</span><input id="fName" autocomplete="name" value="' + esc(p.name || '') + '"></label>' +
      '<div class="grid2"><label class="field"><span>Uni</span><input id="fUni" value="' + esc(p.uni || '') + '" placeholder="e.g. Deakin University"></label>' +
      '<label class="field"><span>Course</span><input id="fCourse" value="' + esc(p.course || '') + '" placeholder="e.g. Bachelor of Marketing"></label></div>' +
      '<div class="field"><span>Year</span>' + chips('year', ['1st year', '2nd year', '3rd year', '4th year +', 'Postgrad'], p.year) + '</div>' +
      '<div class="field"><span>Your uni runs in</span>' + chips('period', ['Trimester', 'Semester', 'Term'], p.period) + '</div></div>';
    [['fName', 'name'], ['fUni', 'uni'], ['fCourse', 'course']].forEach(([id, k]) => { $('#' + id).addEventListener('change', e => saveProf({ [k]: e.target.value.trim() })); });
  }

  /* ---------- study and bedtime ---------- */
  function study() {
    const p = prof(), times = []; for (let h = 19; h <= 24; h++) { times.push((h === 24 ? '00' : h) + ':00'); if (h < 24) times.push(h + ':30'); }
    const lt = p.lightsAt || '21:00';
    $('#study').innerHTML = '<h2>Study and bedtime</h2><p class="lead">Small goals actually get done. Pick one you could hit on a tired night.</p><div class="rows">' +
      '<div class="field"><span>Nightly goal</span>' + chips('goal', [10, 15, 20, 30, 40, 50], +p.goal || 20, v => v + ' questions') + '</div>' +
      '<label class="field" style="max-width:280px"><span>Bedtime</span><select id="fBed">' + times.map(t => '<option value="' + t + '"' + (t === lt ? ' selected' : '') + '>' + t12(t === '00:00' ? '24:00' : t).replace('12 am', 'Midnight') + '</option>').join('') + '</select></label>' +
      '<div class="toggle" data-tog="autoDark"><div><b>Lights off at bedtime</b><small>Lamplight switches to its dark look at ' + t12(lt === '00:00' ? '24:00' : lt).replace('12 am', 'midnight') + ', easier on your eyes before sleep.</small></div><button type="button" class="sw" role="switch" aria-checked="' + !!p.autoDark + '" aria-label="Lights off at bedtime"></button></div>' +
      '<p class="note">Your bedtime also shows on your Dashboard, so you know how long you\'ve got.</p></div>';
    $('#fBed').addEventListener('change', e => { saveProf({ lightsAt: e.target.value }, 'Bedtime saved'); study(); });
  }

  /* ---------- subjects ---------- */
  let editing = null;
  function subjects() {
    const list = L.subjects ? L.subjects() : read('lamplight:subjects', []);
    const U = window.LAMPLIGHT_UNITS || {};
    const card = s => {
      const has = U[s.code || s.id], open = editing === s.id;
      return '<div class="subcard" style="--c:' + s.colour + '"><div class="hd"><i></i><div><b>' + esc(s.name) + '</b><small>' + esc(s.code || 'no code') + ' · ' + s.weeks + ' weeks' + (s.done ? ' · finished' + (s.term ? ' ' + esc(s.term) : '') : '') + (has ? ' · questions ready' : '') + '</small></div>' +
        '<button type="button" class="btn btn-small edit" data-edit="' + esc(s.id) + '">' + (open ? 'Done' : 'Edit') + '</button></div>' +
        (open ? '<div class="body">' +
          '<label class="field"><span>Name</span><input data-f="name" value="' + esc(s.name) + '"></label>' +
          '<div class="grid2"><label class="field"><span>Unit code</span><input value="' + esc(s.code || '') + '" readonly title="The code links the subject to its questions, so it can\'t be changed here."></label>' +
          '<label class="field"><span>Weeks</span><select data-f="weeks">' + [6, 8, 10, 11, 12, 13, 14].map(n => '<option' + (+s.weeks === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label></div>' +
          '<div class="field"><span>Highlighter</span><div class="swatches">' + COLOURS.map(c => '<button type="button" class="swatch" data-col="' + c[1] + '" aria-label="' + c[0] + '" aria-pressed="' + (s.colour === c[1]) + '" style="background:' + c[1] + '"></button>').join('') + '</div></div>' +
          '<div class="toggle" data-done><div><b>I\'ve finished this unit</b><small>Moves it to the end of your list. Everything stays, so you can still revise it.</small></div><button type="button" class="sw" role="switch" aria-checked="' + !!s.done + '" aria-label="Finished this unit"></button></div>' +
          '<div class="rowbtns"><button type="button" class="linkish danger" data-remove="' + esc(s.id) + '">Remove this subject</button><span class="note">Your progress is kept if you add it back later.</span></div>' +
        '</div>' : '') + '</div>';
    };
    $('#subjects').innerHTML = '<h2>My subjects</h2><p class="lead">Rename them, change their colour, or mark the ones you\'ve finished.</p><div class="subs">' +
      (list.length ? list.map(card).join('') : '<p class="note">No subjects yet.</p>') + '</div><div class="rowbtns" style="margin-top:16px"><button type="button" class="btn btn-small" data-addsub>+ Add a subject</button></div>';
  }
  function updateSub(id, patch, msg) {
    const list = (L.subjects ? L.subjects() : []).map(s => s.id === id ? Object.assign({}, s, patch) : s);
    (L.saveSubjects || (v => write('lamplight:subjects', v)))(list); toast(msg || 'Saved'); subjects(); window.dispatchEvent(new Event('lamplight:subjects'));
  }

  /* ---------- appearance ---------- */
  function appearance() {
    const p = prof(), dark = document.documentElement.getAttribute('data-theme') === 'dark';
    const mode = p.autoDark ? 'auto' : dark ? 'dark' : 'light';
    $('#appearance').innerHTML = '<h2>Appearance</h2><p class="lead">Lights on for daytime, lights off for late nights.</p>' +
      chips('look', ['light', 'dark', 'auto'], mode, v => ({ light: 'Lights on', dark: 'Lights off', auto: 'Off at bedtime' })[v]) +
      '<p class="note" style="margin-top:12px">Lights on or off is remembered on each device separately, so your phone can stay dark.</p>';
  }
  function setLook(v) {
    const root = document.documentElement;
    if (v === 'dark') root.setAttribute('data-theme', 'dark'); else if (v === 'light') root.removeAttribute('data-theme');
    write('lamplight:theme-manual', { day: new Date().toDateString() });
    saveProf({ autoDark: v === 'auto' }, v === 'auto' ? 'Lights go off at bedtime' : 'Saved');
    if (v === 'auto') { const lt = (prof().lightsAt || '21:00').split(':').map(Number), n = new Date(), m = n.getHours() * 60 + n.getMinutes(); if (m >= lt[0] * 60 + (lt[1] || 0) || m < 360) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme'); }
    appearance(); study();
  }

  /* ---------- account ---------- */
  let mode = 'in', note = null, busy = false, pwOpen = false;
  const when = t => { if (!t) return 'not yet'; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : new Date(t).toLocaleString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit' }); };
  function account() {
    const info = S ? S.info() : { ready: false }, A = $('#account');
    if (!info.ready) { A.innerHTML = '<h2>Account</h2><p class="lead">Cloud saving isn\'t connected on this copy of Lamplight, so everything stays on this device.</p>'; return; }
    if (info.signedIn) {
      const label = { synced: 'Saved to the cloud', syncing: 'Saving now', error: 'Couldn\'t save just now', off: 'Not saving' }[info.status] || 'Saved';
      const sub = info.status === 'error' ? esc(info.error || 'Check your internet. It will try again.') : 'Last synced ' + when(info.last) + (info.pending ? ', ' + info.pending + ' change' + (info.pending > 1 ? 's' : '') + ' waiting' : '');
      A.innerHTML = '<h2>Account</h2><p class="lead">Signed in as <b>' + esc(info.email) + '</b>. Sign in with the same email on any device to pick up where you left off.</p><div class="rows">' +
        '<div class="status" data-s="' + info.status + '"><i></i><div><b>' + label + '</b><small>' + sub + '</small></div></div>' +
        '<div class="rowbtns"><button class="btn btn-small" id="syncNow" type="button"' + (busy ? ' disabled' : '') + '>Sync now</button><button class="btn btn-small" id="pwBtn" type="button">' + (pwOpen ? 'Cancel' : 'Change password') + '</button><button class="btn btn-small" id="out" type="button"' + (busy ? ' disabled' : '') + '>Sign out</button></div>' +
        (pwOpen ? '<form class="form" id="pwf" novalidate><label class="field"><span>New password <em>(6 or more characters)</em></span><input id="pw1" type="password" autocomplete="new-password"></label><label class="field"><span>Type it again</span><input id="pw2" type="password" autocomplete="new-password"></label><div><button class="btn btn-yellow btn-small" type="submit">Save new password</button></div></form>' : '') +
        (note ? '<p class="msg ' + note[0] + '">' + esc(note[1]) + '</p>' : '') + '</div>';
      $('#syncNow').onclick = () => { busy = true; account(); S.syncNow().then(() => { busy = false; account(); toast('Synced'); }); };
      $('#out').onclick = () => { busy = true; account(); S.signOut().then(() => { busy = false; note = ['good', 'Signed out. Everything stays saved on this device too.']; account(); top(); }); };
      $('#pwBtn').onclick = () => { pwOpen = !pwOpen; note = null; account(); if (pwOpen) $('#pw1').focus(); };
      if ($('#pwf')) $('#pwf').onsubmit = e => {
        e.preventDefault(); const a = $('#pw1').value, b = $('#pw2').value;
        if (a.length < 6) { note = ['bad', 'Your password needs at least 6 characters.']; return account(); }
        if (a !== b) { note = ['bad', 'Those two don\'t match. Try again.']; return account(); }
        S.changePassword(a).then(() => { pwOpen = false; note = ['good', 'Password changed. Use it next time you sign in.']; account(); }).catch(err => { note = ['bad', err.message]; account(); });
      };
      return;
    }
    const up = mode === 'up';
    const keepEm = $('#em') ? $('#em').value : '', keepPw = $('#pw') ? $('#pw').value : '';
    if (!note && info.signedOutAt) note = ['bad', 'You were signed out on this device. Sign in again and everything comes back.'];
    A.innerHTML = '<h2>' + (up ? 'Create your account' : 'Sign in') + '</h2><p class="lead">' + (up ? 'Make an account so your subjects, scores and diagnostic follow you to every device.' : 'Sign in to bring your progress down from the cloud and keep it saving. Each device or browser needs this once.') + '</p>' +
      '<form class="form" id="f" novalidate><label class="field"><span>Email</span><input id="em" type="email" autocomplete="email"></label>' +
      '<label class="field"><span>Password</span><input id="pw" type="password" autocomplete="' + (up ? 'new-password' : 'current-password') + '"></label>' +
      (note ? '<p class="msg ' + note[0] + '">' + esc(note[1]) + '</p>' : '') +
      '<div class="rowbtns"><button class="btn btn-yellow" type="submit"' + (busy ? ' disabled' : '') + '>' + (busy ? 'One moment' : up ? 'Create account' : 'Sign in') + '</button><button class="linkish" type="button" id="swap">' + (up ? 'Already have an account? Sign in' : 'New here? Create an account') + '</button></div></form>';
    $('#em').value = keepEm || prof().email || ''; $('#pw').value = keepPw;
    $('#swap').onclick = () => { mode = up ? 'in' : 'up'; note = null; account(); };
    $('#f').onsubmit = e => {
      e.preventDefault(); const em = $('#em').value.trim(), pw = $('#pw').value;
      if (!/^\S+@\S+\.\S+$/.test(em)) { note = ['bad', 'Pop in your email address.']; return account(); }
      if (pw.length < 6) { note = ['bad', 'Your password needs at least 6 characters.']; return account(); }
      busy = true; note = null; account(); $('#em').value = em;
      (up ? S.signUp(em, pw) : S.signIn(em, pw).then(() => ({ signedIn: true })))
        .then(r => { busy = false; if (r && r.confirm) { mode = 'in'; note = ['good', 'Nearly there. Check your email for a confirm link, then sign in.']; } else { note = null; toast('Signed in'); } account(); renderAll(); })
        .catch(err => { busy = false; note = ['bad', err.message]; account(); $('#em').value = em; });
    };
  }

  /* ---------- your data ---------- */
  function data() {
    $('#data').innerHTML = '<h2>Your data</h2><p class="lead">Everything Lamplight knows about your study is yours. Download a copy any time.</p><button class="btn btn-small" type="button" id="dl">Download my data</button>';
    $('#dl').onclick = () => {
      const out = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('lamplight:') && !k.startsWith('lamplight:_')) { try { out[k] = JSON.parse(localStorage.getItem(k)); } catch (e) { out[k] = localStorage.getItem(k); } } }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
      a.download = 'lamplight-data-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
    };
  }

  /* ---------- wiring ---------- */
  document.addEventListener('click', e => {
    const c = e.target.closest('[data-chips] .chip-b');
    if (c) { const key = c.parentElement.dataset.chips, v = c.dataset.v;
      if (key === 'look') return setLook(v);
      saveProf({ [key]: key === 'goal' ? +v : v }, key === 'goal' ? 'Nightly goal: ' + v + ' questions' : 'Saved');
      c.parentElement.querySelectorAll('.chip-b').forEach(b => b.setAttribute('aria-pressed', b === c)); return; }
    const tg = e.target.closest('[data-tog]');
    if (tg) { const k = tg.dataset.tog, on = !prof()[k]; if (k === 'autoDark') return setLook(on ? 'auto' : (document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light')); return; }
    const ed = e.target.closest('[data-edit]'); if (ed) { editing = editing === ed.dataset.edit ? null : ed.dataset.edit; subjects(); return; }
    const sw = e.target.closest('.swatch'); if (sw && editing) { updateSub(editing, { colour: sw.dataset.col }, 'Colour changed'); return; }
    const dn = e.target.closest('[data-done]'); if (dn && editing) { const s = (L.subjects() || []).find(x => x.id === editing); updateSub(editing, { done: !s.done }, s.done ? 'Back in your current subjects' : 'Marked as finished'); return; }
    const rm = e.target.closest('[data-remove]');
    if (rm) { if (!rm.dataset.sure) { rm.dataset.sure = '1'; rm.textContent = 'Tap again to remove'; return; }
      (L.saveSubjects)((L.subjects() || []).filter(s => s.id !== rm.dataset.remove)); editing = null; toast('Subject removed'); subjects(); window.dispatchEvent(new Event('lamplight:subjects')); return; }
    if (e.target.closest('[data-addsub]')) { if (L.addSubject) L.addSubject(); return; }
  });
  document.addEventListener('change', e => {
    const f = e.target.closest('.subcard [data-f]'); if (!f || !editing) return;
    const k = f.dataset.f, v = k === 'weeks' ? +f.value : f.value.trim(); if (k === 'name' && !v) return;
    updateSub(editing, { [k]: v }, k === 'name' ? 'Renamed' : 'Saved');
  });
  window.addEventListener('lamplight:subjects', () => subjects());

  /* highlight the section you're looking at */
  const links = [...document.querySelectorAll('.snav a')];
  const mark = id => links.forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + id)));
  const obs = new IntersectionObserver(es => { const v = es.filter(x => x.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0]; if (v) mark(v.target.id); }, { rootMargin: '-90px 0px -60% 0px' });
  document.querySelectorAll('.sec').forEach(s => obs.observe(s));
  mark((location.hash || '#profile').slice(1));

  function renderAll() { top(); profile(); study(); subjects(); appearance(); account(); data(); }
  renderAll();
  if (location.hash) { const t = document.querySelector(location.hash); if (t) setTimeout(() => t.scrollIntoView({ block: 'start' }), 60); }
  window.addEventListener('hashchange', () => { const t = document.querySelector(location.hash); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  if (S) S.on(() => { if (!document.activeElement || !document.activeElement.closest || !document.activeElement.closest('#account form')) { account(); top(); } });
  $('#lights').addEventListener('click', () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark');
    setTimeout(appearance, 0);
  });
})();
</script>
<script src="js/tour.js"></script>
</body>
</html>
