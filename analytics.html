<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analytics · Lamplight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/lamplight.css">
<style>
  /* chart series colours (validated for colour-blind separation and contrast) */
  :root { --s1: #2F7FC1; --s2: #D9731A; --s3: #6B4FB8; --s4: #2E9A5B; --s5: #C2416E; }
  :root[data-theme="dark"] { --s1: #4A97D9; --s2: #D2762C; --s3: #8A72D6; --s4: #36A064; --s5: #D9658E; }

  .navlinks a[aria-current="page"] { background: var(--hl-yellow); color: #141414; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--ink); background: var(--hl-pink); color: #141414; display: grid; place-items: center; font: 800 17px var(--font-display); text-decoration: none; box-shadow: 0 3px 0 var(--shadow); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
  .icon-btn:hover { border-color: var(--ink); }

  /* report tabs + filters (IXL's second row) */
  .rtabs { margin-top: 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; background: var(--paper-2); border: 2px solid var(--line); border-radius: 16px; padding: 6px; }
  .rtabs::-webkit-scrollbar { display: none; }
  .rtab { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 11px; border: 2px solid transparent; background: none; font-weight: 700; font-size: 14.5px; color: var(--ink-2); cursor: pointer; }
  .rtab:hover { background: var(--card); color: var(--ink); }
  .rtab[aria-selected="true"] { background: var(--card); color: var(--ink); border-color: var(--ink); box-shadow: 0 3px 0 var(--shadow); }
  .rtab svg { color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 16px 0 0; }
  .filters label { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .filters select { font: 700 14.5px var(--font-body); letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 7px 30px 7px 10px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
  .filters select:focus { border-color: var(--ink); outline: none; }
  .sample { margin-left: auto; font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--hl-green); color: #141414; }

  .title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 38px 0 22px; }
  .title h1 { font-size: clamp(42px, 6vw, 76px); letter-spacing: -0.045em; }
  .title .hand { font-size: 26px; color: var(--muted); transform: rotate(-2deg); display: inline-block; }

  .panel { background: var(--card); border: 2.5px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--shadow); padding: 26px; margin-bottom: 26px; }
  @media (max-width: 640px) { .panel { padding: 18px; } }
  .panel h2 { font-size: 30px; letter-spacing: -0.035em; }
  .panel .lead { color: var(--ink-2); margin: 8px 0 20px; font-size: 15.5px; }

  /* growth */
  .growth { display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 820px) { .growth { grid-template-columns: 1fr; } }
  .levels { display: grid; gap: 14px; }
  .lvl { display: grid; grid-template-columns: 14px 1fr; gap: 4px 12px; padding: 14px; border-radius: 16px; background: var(--paper); border: 2px solid var(--line); }
  .lvl i { width: 14px; height: 14px; border-radius: 4px; grid-row: span 2; margin-top: 3px; }
  .lvl small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .lvl small em { font-style: normal; font-weight: 600; letter-spacing: 0; text-transform: none; }
  .lvl b { font: 800 44px/1 var(--font-display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .lvl .delta { grid-column: 2; font-size: 13.5px; font-weight: 700; color: var(--good); }
  .chartcard { position: relative; overflow-x: clip; }
  .chartcard .ch-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .chartcard .ch-head b { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .axis { font: 600 11.5px var(--font-body); fill: var(--muted); }
  .chart .end { font: 700 12px var(--font-body); fill: var(--ink); }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.35; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); opacity: 0; transition: opacity .12s; z-index: 5; }
  .tip b { display: block; font-size: 12px; opacity: .75; font-weight: 600; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  .tip i { width: 9px; height: 9px; border-radius: 2px; }

  /* accomplishments */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
  @media (max-width: 700px) { .kpis { grid-template-columns: 1fr; } }
  .kpi { padding: 20px 22px; display: flex; gap: 14px; align-items: center; border-right: 2px solid var(--line); }
  .kpi:last-child { border-right: 0; }
  @media (max-width: 700px) { .kpi { border-right: 0; border-bottom: 2px solid var(--line); } .kpi:last-child { border-bottom: 0; } }
  .kpi .ic { width: 46px; height: 46px; border-radius: 13px; border: 2px solid var(--ink); display: grid; place-items: center; flex: none; color: #141414; }
  .kpi small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .kpi b { display: block; font: 800 36px/1.05 var(--font-display); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
  .donuts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 24px; }
  .donut { display: flex; align-items: center; gap: 18px; position: relative; }
  .donut h4 { margin: 0 0 10px; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .donut svg { width: 128px; height: 128px; flex: none; }
  .donut .ctr b { font: 800 30px var(--font-display); fill: var(--ink); }
  .donut ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .donut li { display: flex; align-items: center; gap: 8px; }
  .donut li i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .donut li span.n { margin-left: auto; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding-left: 8px; }
  .seg { cursor: default; transition: opacity .15s; }
  .donut:hover .seg { opacity: .45; } .donut .seg:hover { opacity: 1; }

  /* tables */
  .tblwrap { overflow-x: auto; border: 2px solid var(--ink); border-radius: 16px; margin-top: 22px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 560px; }
  thead th { text-align: left; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 13.5px; padding: 12px 16px; white-space: nowrap; }
  thead th button { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  thead th button:focus-visible { outline: 2px solid var(--hl-yellow); outline-offset: 3px; border-radius: 4px; }
  thead th.num, td.num { text-align: right; }
  tbody td { padding: 12px 16px; border-top: 1.5px solid var(--line); vertical-align: middle; }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--paper) 70%, var(--card)); }
  td .subj { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
  td .subj i { width: 10px; height: 10px; border-radius: 99px; }
  td a { font-weight: 600; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  td .code { font: 700 11.5px var(--font-mono); color: var(--muted); margin-left: 8px; }
  td .ico { display: inline-block; vertical-align: -3px; margin-left: 6px; }
  td.date { white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  td.miss { font: 800 20px var(--font-display); color: var(--bad); font-variant-numeric: tabular-nums; }
  .tfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-top: 2px solid var(--ink); font-size: 14px; }
  .tfoot .keys { display: flex; gap: 16px; color: var(--ink-2); font-weight: 600; }
  .tfoot .keys span { display: inline-flex; gap: 6px; align-items: center; }
  .linkbtn { background: none; border: 0; padding: 0; font-weight: 700; font-size: 14.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: var(--hl-yellow); color: var(--ink); }
  .hint { display: flex; gap: 12px; align-items: flex-start; margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--paper); color: var(--ink-2); font-size: 15px; }
  .hint svg { flex: none; }

  .opportunity { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 820px) { .opportunity { grid-template-columns: 1fr; } }
  .op { border-radius: 20px; border: 2px solid var(--ink); padding: 22px; display: grid; gap: 10px; align-content: start; }
  .op.a { background: var(--hl-yellow); color: #141414; }
  .op.b { background: var(--paper-2); }
  .op h3 { font-size: 24px; letter-spacing: -0.03em; line-height: 1.15; }
  .op p { margin: 0; font-size: 15px; }
  .op .btn { justify-self: start; margin-top: 6px; }

  .soon { text-align: center; padding: 50px 24px; border: 2px dashed var(--line); border-radius: 24px; background: var(--card); color: var(--ink-2); }
  .soon .hand { font-size: 30px; color: var(--muted); display: block; margin-bottom: 8px; }
  .soon h2 { font-size: 34px; letter-spacing: -0.035em; }
  .soon p { max-width: 34em; margin: 10px auto 0; }


  .filters select:disabled { opacity: .5; }
  .kpis.four { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { .kpis.four { grid-template-columns: repeat(2, 1fr); } .kpis.four .kpi { border-bottom: 2px solid var(--line); } }
  .two { display: grid; grid-template-columns: 1fr 1.2fr; gap: 26px; }
  @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
  .hbars { display: grid; gap: 12px; }
  .hb { display: grid; grid-template-columns: 120px 1fr 44px; gap: 12px; align-items: center; font-size: 14.5px; font-weight: 600; }
  .hb .track { height: 14px; border-radius: 99px; background: var(--paper-2); overflow: hidden; }
  .hb .track i { display: block; height: 100%; background: var(--s1); border-radius: 99px; }
  .hb b { text-align: right; font-family: var(--font-mono); font-size: 13px; }
  table.compact { min-width: 420px; font-size: 14px; } table.compact td, table.compact th { padding: 10px 12px; }
  .tcard { background: var(--card); border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 0 4px 0 var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .thead { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 12px 1fr auto; gap: 14px; align-items: center; padding: 16px 20px; cursor: pointer; }
  .thead:focus-visible { outline: 3px solid var(--hl-blue); outline-offset: -3px; }
  .thead i { width: 12px; height: 36px; border-radius: 5px; background: var(--c); }
  .thead b { display: block; font-size: 16.5px; }
  .thead small { color: var(--muted); font-size: 13px; }
  .tn { font: 800 28px/1 var(--font-display); color: var(--bad); text-align: right; }
  .tn small { display: block; font: 600 11.5px var(--font-body); color: var(--muted); }
  .tbody { padding: 0 20px 20px; display: grid; gap: 14px; }
  .tq { border-top: 2px solid var(--paper-2); padding-top: 14px; }
  .times { font: 700 12px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--bad); }
  .qa .qt { margin: 6px 0 10px; font-size: 15.5px; font-weight: 600; }
  .ans { padding: 12px 14px; border-radius: 12px; background: var(--good-soft); font-size: 15px; }
  .ans .lbl { display: block; font: 700 11.5px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--good); margin-bottom: 4px; }
  .ans ol, .ans ul { margin: 4px 0 0; padding-left: 20px; }
  .ans s { color: var(--bad); }
  .expl { margin: 10px 0 0; font-size: 14.5px; color: var(--ink-2); }
  .tbody .btn { justify-self: start; }
  .legendbar { display: flex; gap: 16px; flex-wrap: wrap; margin: -8px 0 20px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .legendbar span { display: inline-flex; align-items: center; gap: 6px; }
  .legendbar .cell { width: 18px; height: 18px; border-radius: 5px; }
  .sgrid { display: grid; gap: 10px; margin-top: 14px; }
  .srow { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: center; }
  @media (max-width: 700px) { .srow { grid-template-columns: 1fr; gap: 6px; } }
  .sw b { display: block; font-size: 14.5px; }
  .sw small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cells { display: flex; gap: 6px; flex-wrap: wrap; }
  .cell { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font: 700 13px var(--font-mono); text-decoration: none; color: #141414; border: 2px solid transparent; }
  a.cell:hover { border-color: var(--ink); }
  .cell.b0 { background: var(--paper-2); color: var(--muted); }
  .cell.b1 { background: color-mix(in srgb, var(--hl-orange) 35%, var(--paper)); }
  .cell.b2 { background: color-mix(in srgb, var(--hl-yellow) 70%, var(--paper)); }
  .cell.b3 { background: color-mix(in srgb, var(--hl-blue) 60%, var(--paper)); }
  .cell.b4 { background: var(--hl-blue); }
  .cell.b5 { background: var(--hl-green); border-color: var(--ink); font-size: 17px; }
  .qlist { background: var(--card); border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 0 4px 0 var(--shadow); overflow: hidden; }
  .qrow + .qrow { border-top: 1.5px solid var(--line); }
  .qhead { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 74px 1fr auto; gap: 14px; align-items: center; padding: 13px 18px; cursor: pointer; }
  .qhead:disabled { cursor: default; }
  .qhead:focus-visible { outline: 3px solid var(--hl-blue); outline-offset: -3px; }
  .qhead:not(:disabled):hover { background: var(--paper); }
  .res { font: 700 12px var(--font-body); padding: 4px 8px; border-radius: 99px; text-align: center; }
  .res.ok { background: var(--good-soft); color: var(--good); }
  .res.no { background: var(--bad-soft); color: var(--bad); }
  .qm { min-width: 0; }
  .qm b { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qrow.open .qm b { white-space: normal; }
  .qm small { color: var(--muted); font-size: 12.5px; }
  .when { font: 600 12.5px var(--font-mono); color: var(--muted); white-space: nowrap; }
  @media (max-width: 600px) { .qhead { grid-template-columns: 64px 1fr; } .when { grid-column: 2; } }
  .qbody { padding: 0 18px 18px 106px; }
  @media (max-width: 600px) { .qbody { padding: 0 18px 18px; } }
  .plist { display: grid; gap: 4px; }
  .prow { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 120px; gap: 16px; align-items: center; padding: 12px 10px; border-radius: 12px; text-decoration: none; color: var(--ink); }
  .prow:hover { background: var(--paper); }
  @media (max-width: 700px) { .prow { grid-template-columns: 1fr auto; } .ptrack { grid-column: 1 / -1; grid-row: 2; } }
  .pn b { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; }
  .pn small { color: var(--muted); font-size: 12.5px; }
  .ptrack { position: relative; height: 14px; border-radius: 99px; background: var(--paper-2); overflow: hidden; }
  .ptrack .pfrom { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--c) 35%, var(--paper-2)); }
  .ptrack .pgain { position: absolute; top: 0; bottom: 0; background: var(--c); }
  .ptrack .pgain.lost { background: var(--bad); opacity: .35; }
  .pd { font: 700 13.5px var(--font-mono); text-align: right; white-space: nowrap; color: var(--muted); }
  .pd.up { color: var(--good); } .pd.down { color: var(--bad); }
  .pagefoot { margin-top: 60px; border-top: 2px solid var(--ink); padding-block: 24px 40px; color: var(--muted); font-size: 14px; }
</style>
<script src="js/config.js"></script>
<script src="js/sync.js"></script>
<script src="js/menu.js"></script>
</head>
<body class="app">

<header class="topbar">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="index.html" aria-label="Lamplight home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 14 16 4l8 10Z" fill="var(--hl-yellow)" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 17 5 29h22l-6-12Z" fill="var(--hl-yellow)" opacity=".45"/><circle cx="16" cy="15.5" r="2" fill="var(--ink)"/></svg>
        Lamplight
      </a>
      <nav class="navlinks" aria-label="Main">
        <a href="dashboard.html">Home</a>
        <a href="subject.html">Learning</a>
        <a href="diagnostic.html">Diagnostic</a>
        <a href="analytics.html" aria-current="page">Analytics</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" type="button" id="lights" aria-label="Turn lights off" title="Lights off">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        </button>
        <a class="avatar" href="account.html" aria-label="Your account">S</a>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="rtabs" role="tablist" aria-label="Reports" id="rtabs">
    <button class="rtab" role="tab" data-t="summary" aria-selected="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 15l3-3 3 2 4-5"/></svg>Summary</button>
    <button class="rtab" role="tab" data-t="usage" aria-selected="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Usage</button>
    <button class="rtab" role="tab" data-t="trouble" aria-selected="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19Z"/><path d="M12 10v4M12 17v.5"/></svg>Trouble spots</button>
    <button class="rtab" role="tab" data-t="scores" aria-selected="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Scores</button>
    <button class="rtab" role="tab" data-t="questions" aria-selected="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h10"/></svg>Questions</button>
    <button class="rtab" role="tab" data-t="progress" aria-selected="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/></svg>Progress</button>
  </div>

  <div class="filters">
    <label>Subject <select id="fSubject"></select></label>
    <label>Weeks <select id="fWeeks"></select></label>
    <label>Date range <select id="fRange"><option value="all">All time</option><option value="30">Last 30 days</option><option value="7">Last 7 days</option></select></label>
  </div>

  <div id="report"></div>
</main>

<footer class="pagefoot">
  <div class="wrap">Everything here comes from your own practice, saved to your account.</div>
</footer>

<script src="js/diag-core.js"></script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const UNITS = window.LAMPLIGHT_UNITS || {};
  const L = window.Lamplight || {}, D = window.LamplightDiag;
  const read = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const PR = (L.progress && L.progress()) || {};
  const LOG = read('lamplight:log', []).filter(x => x && x.t && x.s).sort((a, b) => a.t - b.t);
  const profile = (L.profile && L.profile()) || {};
  const DAY = 86400000, now = Date.now();
  const sod = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const today = sod(now);
  const COLS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
  const SUBS = (L.subjects ? L.subjects() : []).filter(s => UNITS[s.code || s.id]).map((s, i) => ({ s, code: s.code || s.id, U: UNITS[s.code || s.id], c: COLS[i % COLS.length] }));
  const BY = {}; SUBS.forEach(x => BY[x.code] = x);
  const IDX = {};
  SUBS.forEach(x => x.U.weekList.forEach(w => w.skills.forEach(k => { IDX[k.id] = { k, w, U: x.U, x }; })));
  const score = id => (PR[id] && PR[id].score) || 0;
  const fmt = (t, o) => new Date(t).toLocaleDateString('en-AU', o || { day: 'numeric', month: 'short' });
  const code = k => k.id.replace('-', ' ');

  /* ---------- filters ---------- */
  let tab = (location.hash.slice(1) || 'summary'), subj = 'all', wk = 'all', range = 'all', showAll = false, sort = { k: 'date', dir: -1 }, open = null, qMore = 25;
  const t0 = () => range === 'all' ? (LOG.length ? sod(LOG[0].t) : today - 29 * DAY) : today - (+range - 1) * DAY;
  const inRange = t => range === 'all' || t >= t0();
  const inView = id => IDX[id] && (subj === 'all' || IDX[id].U.code === subj) && (wk === 'all' || IDX[id].w.week === +wk);
  const rows = () => LOG.filter(x => inView(x.s) && inRange(x.t));
  const subsInView = () => subj === 'all' ? SUBS : SUBS.filter(x => x.code === subj);
  function filters() {
    $('#fSubject').innerHTML = '<option value="all">All subjects</option>' + SUBS.map(x => '<option value="' + esc(x.code) + '"' + (subj === x.code ? ' selected' : '') + '>' + esc(x.U.name) + '</option>').join('');
    const W = $('#fWeeks');
    if (subj === 'all') { W.innerHTML = '<option value="all">All weeks</option>'; W.disabled = true; }
    else { W.disabled = false; W.innerHTML = '<option value="all">All weeks</option>' + BY[subj].U.weekList.map(w => '<option value="' + w.week + '"' + (+wk === w.week ? ' selected' : '') + '>Week ' + w.week + '</option>').join(''); }
    $('#fRange').value = range;
  }

  /* ---------- replay the log to know scores over time ---------- */
  const gain = (s, ok) => ok ? Math.min(100, s + (s < 40 ? 16 : s < 60 ? 11 : s < 80 ? 9 : s < 90 ? 5 : 4)) : Math.max(0, s - (s < 40 ? 4 : s < 80 ? 8 : 12));
  const REPLAY = {}, MASTERED_AT = {};
  LOG.forEach(x => { const s = gain(REPLAY[x.s] || 0, x.ok); REPLAY[x.s] = s; if (s >= 100 && !MASTERED_AT[x.s]) MASTERED_AT[x.s] = x.t; });
  Object.keys(PR).forEach(id => { if (score(id) >= 100 && !MASTERED_AT[id]) MASTERED_AT[id] = PR[id].last || (LOG[0] ? LOG[0].t : now); });
  Object.keys(MASTERED_AT).forEach(id => { if (score(id) < 100) delete MASTERED_AT[id]; }); /* only skills that are mastered now */
  const scoreBefore = (id, t) => { let s = 0; for (const x of LOG) { if (x.t >= t) break; if (x.s === id) s = gain(s, x.ok); } return s; };
  const reached = id => MASTERED_AT[id] || (PR[id] && PR[id].last) || 0;

  const DUR = new Map(); LOG.forEach((x, i) => { const g = i ? x.t - LOG[i - 1].t : Infinity; DUR.set(x, g < 5 * 60000 ? g / 1000 : 30); });
  const minutes = list => Math.round(list.reduce((a, x) => a + (DUR.get(x) || 30), 0) / 60);
  const hm = m => m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min';
  const level = x => { if (!D || !D.weekLevel) return null; const v = x.U.weekList.filter(w => wk === 'all' || w.week === +wk).map(w => D.weekLevel(x.code, w.week).v).filter(v => v != null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
  const rangeWord = () => range === 'all' ? 'all time' : range === '7' ? 'the last 7 days' : 'the last 30 days';
  const empty = (h, p) => '<div class="soon"><span class="hand">' + h + '</span><p>' + p + '</p></div>';
  const trophy = '<svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-label="Mastered"><path d="M7 4h10v5a5 5 0 0 1-10 0Z" fill="var(--hl-yellow)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 6H4.5a2.5 3 0 0 0 3 4M17 6h2.5a2.5 3 0 0 1-3 4M12 14v4M8 20h8" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const ribbon = '<svg class="ico" width="14" height="16" viewBox="0 0 20 24" aria-label="Proficient"><path d="M4 2h12v20l-6-4-6 4Z" fill="var(--hl-blue)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  const subjCell = x => '<span class="subj"><i style="background:' + x.c + '"></i>' + esc(x.U.name) + '</span>';
  const kpi = (bg, ic, label, val) => '<div class="kpi"><span class="ic" style="background:' + bg + '">' + ic + '</span><div><small>' + label + '</small><b>' + val + '</b></div></div>';
  const IC = {
    q: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16Z"/></svg>',
    t: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    s: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l6-8 4 5 3-3 3 4v6H4Z"/></svg>',
    n: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>'
  };

  /* ---------- question text and right answers ---------- */
  function qText(q) {
    let t = q.prompt || '';
    if (q.passage) t = q.passage + ' ' + t;
    if (q.type === 'fill_gap' && q.text) t = q.text.replace('___', '_____');
    if (q.type === 'fix_error' && q.sentence) t = q.sentence;
    return t;
  }
  function answerHTML(q) {
    switch (q.type) {
      case 'mc': case 'case': case 'analogy': return esc(q.options[q.answer]);
      case 'fill_gap': case 'type_answer': return esc((q.answers || [])[0]);
      case 'fix_error': return '<s>' + esc(q.wrong) + '</s> should be <b>' + esc(q.correct) + '</b>';
      case 'order': return '<ol>' + q.items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ol>';
      case 'match': return '<ul>' + q.pairs.map(p => '<li>' + esc(p[0]) + ': <b>' + esc(p[1]) + '</b></li>').join('') + '</ul>';
      case 'sort': return '<ul>' + q.categories.map((c, i) => '<li><b>' + esc(c) + ':</b> ' + q.items.filter(x => x.cat === i).map(x => esc(x.text)).join(', ') + '</li>').join('') + '</ul>';
      default: return '';
    }
  }
  const qBlock = (q, noText) => '<div class="qa">' + (noText ? '' : '<p class="qt">' + esc(qText(q)) + '</p>') + '<div class="ans"><span class="lbl">Right answer</span>' + answerHTML(q) + '</div>' + (q.explanation ? '<p class="expl">' + esc(q.explanation) + '</p>' : '') + '</div>';

  /* ---------- line chart: skills mastered over time ---------- */
  let LC = null;
  function lineChart(xs) {
    const start = t0(), N = 8, pts = [];
    for (let i = 0; i < N; i++) pts.push(start + (now - start) * i / (N - 1));
    let series = xs.map(x => ({ x, v: pts.map(t => Object.keys(MASTERED_AT).filter(id => inView(id) && IDX[id].x === x && MASTERED_AT[id] <= t).length) }));
    const live = series.filter(sr => sr.v[sr.v.length - 1] > 0); if (live.length) series = live;
    const max = Math.max(4, ...series.flatMap(s => s.v));
    const top = Math.ceil(max / 4) * 4;
    LC = { pts, series };
    const W = 640, H = 250, Lm = 38, R = 120, T = 14, B = 30;
    const x = i => Lm + i * (W - Lm - R) / (N - 1), y = v => T + (H - T - B) * (1 - v / top);
    let s = '<svg class="chart" id="lc" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Skills mastered over time">';
    [0, .25, .5, .75, 1].forEach(f => { const v = Math.round(top * f); s += '<line class="grid" x1="' + Lm + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="axis" x="' + (Lm - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
    pts.forEach((t, i) => { if (i % 2 === 0 || i === N - 1) s += '<text class="axis" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + fmt(t) + '</text>'; });
    s += '<line id="xh" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
    series.forEach(sr => {
      const p = sr.v.map((v, i) => [x(i), y(v)]);
      s += '<polyline fill="none" stroke="' + sr.x.c + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + p.map(q => q.join(',')).join(' ') + '"/>';
      const lp = p[p.length - 1];
      s += '<circle cx="' + lp[0] + '" cy="' + lp[1] + '" r="6" fill="' + sr.x.c + '" stroke="var(--card)" stroke-width="2"/>';
      s += '<text class="end" x="' + (lp[0] + 12) + '" y="' + (lp[1] + 4) + '">' + esc(sr.x.code) + ' ' + sr.v[N - 1] + '</text>';
    });
    s += '<rect id="hit" x="' + Lm + '" y="' + T + '" width="' + (W - Lm - R) + '" height="' + (H - T - B) + '" fill="transparent"/></svg>';
    return s;
  }
  function wireLine() {
    const svg = $('#lc'), hit = $('#hit'), xh = $('#xh'), tip = $('#ltip'); if (!svg || !LC) return;
    const W = 640, Lm = 38, R = 120, N = LC.pts.length;
    const move = e => {
      const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(N - 1, Math.round((sx - Lm) / ((W - Lm - R) / (N - 1))))), px = Lm + i * (W - Lm - R) / (N - 1);
      xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('opacity', 1);
      tip.innerHTML = '<b>' + fmt(LC.pts[i], { day: 'numeric', month: 'short', year: 'numeric' }) + '</b>' + LC.series.map(sr => '<div class="row"><i style="background:' + sr.x.c + '"></i>' + esc(sr.x.code) + ': ' + sr.v[i] + ' mastered</div>').join('');
      tip.style.left = (px / W * r.width) + 'px'; tip.style.top = '96px'; tip.style.opacity = 1;
    };
    hit.addEventListener('mousemove', move);
    hit.addEventListener('mouseleave', () => { xh.setAttribute('opacity', 0); tip.style.opacity = 0; });
  }

  /* ---------- donut: skills practised by week group ---------- */
  function donut(x, list) {
    const n = x.U.weekList.length, size = Math.ceil(n / 3);
    const groups = [0, 1, 2].map(g => ({ a: g * size + 1, b: Math.min(n, (g + 1) * size) })).filter(g => g.a <= n);
    const ids = new Set(list.filter(r => IDX[r.s].x === x).map(r => r.s));
    const vals = groups.map(g => [...ids].filter(id => IDX[id].w.week >= g.a && IDX[id].w.week <= g.b).length);
    const tot = vals.reduce((a, b) => a + b, 0), Rr = 52, C = 2 * Math.PI * Rr, gap = tot > 1 ? 3 : 0, shades = [1, 0.68, 0.4];
    let off = 0, segs = '<circle cx="64" cy="64" r="' + Rr + '" fill="none" stroke="var(--paper-2)" stroke-width="18"/>';
    if (tot) vals.forEach((v, i) => { if (!v) return; const len = v / tot * C; segs += '<circle class="seg" cx="64" cy="64" r="' + Rr + '" fill="none" stroke="' + x.c + '" stroke-opacity="' + shades[i] + '" stroke-width="18" stroke-dasharray="' + Math.max(0, len - gap) + ' ' + (C - len + gap) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 64 64)"><title>Weeks ' + groups[i].a + ' to ' + groups[i].b + ': ' + v + '</title></circle>'; off += len; });
    return '<div class="donut"><svg viewBox="0 0 128 128" role="img" aria-label="' + esc(x.U.name) + ': ' + tot + ' skills practised">' + segs +
      '<text x="64" y="66" text-anchor="middle"><tspan x="64" dy="0" style="font:800 30px var(--font-display);fill:var(--ink)">' + tot + '</tspan><tspan x="64" dy="18" style="font:600 12px var(--font-body);fill:var(--muted)">skills</tspan></text></svg>' +
      '<div><h4>' + esc(x.U.code) + ' skills practised</h4><ul>' + groups.map((g, i) => '<li><i style="background:' + x.c + ';opacity:' + shades[i] + '"></i>Weeks ' + g.a + ' to ' + g.b + '<span class="n">' + vals[i] + '</span></li>').join('') + '</ul></div></div>';
  }

  /* ---------- SUMMARY ---------- */
  function summary() {
    const all = subsInView(), list = rows();
    const act = all.filter(x => list.some(r => IDX[r.s].x === x) || level(x) != null || Object.keys(MASTERED_AT).some(id => IDX[id] && IDX[id].x === x));
    const xs = act.length ? act : all;
    if (!xs.length) return '<div class="title"><h1>Summary report</h1></div>' + empty('no subjects yet', 'Add a subject and practise a little, and your report fills in here.');
    if (!LOG.length && !Object.keys(PR).some(id => PR[id].answered)) return '<div class="title"><h1>Summary report</h1><span class="hand">how far you\'ve come</span></div>' + empty('nothing to report yet', 'Answer a few questions and this page fills in: your levels, skills mastered over time, where you\'re slipping and what to do next.') + '<div style="display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap"><a class="btn btn-yellow" href="dashboard.html">Start tonight</a><a class="btn" href="arena.html">Run a diagnostic</a></div>';
    const learned = Object.keys(PR).filter(id => inView(id) && score(id) >= 80 && inRange(reached(id))).map(id => ({ id, x: IDX[id].x, k: IDX[id].k, m: score(id) >= 100, t: reached(id) }))
      .sort((a, b) => { const va = sort.k === 'date' ? a.t : sort.k === 'skill' ? a.k.name : a.x.U.name, vb = sort.k === 'date' ? b.t : sort.k === 'skill' ? b.k.name : b.x.U.name; return (va > vb ? 1 : va < vb ? -1 : 0) * sort.dir; });
    const shown = showAll ? learned : learned.slice(0, 8);
    const miss = {}; list.forEach(r => { if (!r.ok && score(r.s) < 100) miss[r.s] = (miss[r.s] || 0) + 1; });
    const focus = Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 7);
    const arrow = k => '<svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><path d="M5 1 9 5H1Z" fill="currentColor" opacity="' + (sort.k === k && sort.dir === 1 ? 1 : .35) + '"/><path d="M5 11 1 7h8Z" fill="currentColor" opacity="' + (sort.k === k && sort.dir === -1 ? 1 : .35) + '"/></svg>';
    let worst = null;
    if (D && D.weekLevel) xs.forEach(x => x.U.weekList.forEach(w => { if (wk !== 'all' && w.week !== +wk) return; const v = D.weekLevel(x.code, w.week).v; if (v != null && (!worst || v < worst.v)) worst = { v, x, w }; }));
    const totalMastered = Object.keys(PR).filter(id => inView(id) && score(id) >= 100).length;
    const newMastered = Object.keys(MASTERED_AT).filter(id => inView(id) && inRange(MASTERED_AT[id])).length;
    return '<div class="title"><h1>Summary report</h1><span class="hand">how far you\'ve come</span></div>' +
      '<section class="panel"><h2>Your overall growth</h2><p class="lead">Your level in each subject (from the diagnostic and your practice), and how many skills you\'ve mastered over ' + rangeWord() + '.</p>' +
      '<div class="growth"><div class="levels">' + xs.map(x => { const lv = level(x), m = Object.keys(MASTERED_AT).filter(id => inView(id) && IDX[id].x === x && inRange(MASTERED_AT[id])).length;
        return '<div class="lvl"><i style="background:' + x.c + '"></i><small>' + esc(x.U.code) + ' level</small><b>' + (lv != null ? lv : '<span style="font-size:20px;color:var(--muted)">not yet</span>') + '</b><span class="delta">' + (m ? '+' + m + ' skill' + (m === 1 ? '' : 's') + ' mastered' : '<span style="color:var(--muted)">no skills mastered yet</span>') + '</span></div>'; }).join('') + '</div>' +
      (() => { const ch = lineChart(xs); return '<div class="chartcard"><div class="ch-head"><b>Skills mastered over time</b>' + (LC.series.length > 1 ? '<div class="legend">' + LC.series.map(sr => '<span><i style="background:' + sr.x.c + '"></i>' + esc(sr.x.code) + '</span>').join('') + '</div>' : '') + '</div>' + ch; })() + '<div class="tip" id="ltip"></div><p class="note">A skill counts as mastered when its SmartScore reaches 100.</p></div></div></section>' +
      '<section class="panel"><h2>Your accomplishments</h2><p class="lead">What you\'ve done over ' + rangeWord() + '.</p>' +
      '<div class="kpis">' + kpi('var(--hl-green)', IC.q, 'Questions answered', list.length.toLocaleString()) + kpi('var(--hl-blue)', IC.t, 'Time practising', hm(minutes(list))) + kpi('var(--hl-orange)', IC.s, 'Skills practised', new Set(list.map(r => r.s)).size) + '</div>' +
      '<div class="donuts">' + xs.map(x => donut(x, list)).join('') + '</div>' +
      '<h3 style="font-size:21px;margin-top:30px;letter-spacing:-0.02em">You\'ve learned these skills</h3>' +
      (learned.length ? '<div class="tblwrap"><table><thead><tr><th><button type="button" data-sort="subject">Subject ' + arrow('subject') + '</button></th><th><button type="button" data-sort="skill">Skill ' + arrow('skill') + '</button></th><th class="num"><button type="button" data-sort="date">Date ' + arrow('date') + '</button></th></tr></thead><tbody>' +
        shown.map(r => '<tr><td>' + subjCell(r.x) + '</td><td><a href="practice.html#' + encodeURIComponent(r.id) + '">' + esc(r.k.name) + '</a><span class="code">' + esc(code(r.k)) + '</span>' + (r.m ? trophy : ribbon) + '</td><td class="num date">' + (r.t ? fmt(r.t) : '') + '</td></tr>').join('') +
        '</tbody></table><div class="tfoot">' + (learned.length > 8 ? '<button class="linkbtn" type="button" data-all>' + (showAll ? 'Show fewer' : 'See all ' + learned.length + ' skills') + '</button>' : '<span></span>') +
        '<div class="keys"><span>' + trophy + learned.filter(r => r.m).length + ' mastered (100)</span><span>' + ribbon + learned.filter(r => !r.m).length + ' proficient (80+)</span></div></div></div>'
        : '<div class="hint">Get a skill to a SmartScore of 80 and it shows up here. 100 means mastered.</div>') +
      '</section>' +
      '<section class="panel"><h2>Your areas to focus on</h2><p class="lead">Skills you\'ve missed the most questions on over ' + rangeWord() + ', and haven\'t mastered yet.</p>' +
      (focus.length ? '<div class="tblwrap" style="margin-top:0"><table><thead><tr><th>Subject</th><th>Skill</th><th class="num">Questions missed</th></tr></thead><tbody>' +
        focus.map(([id, n]) => '<tr><td>' + subjCell(IDX[id].x) + '</td><td><a href="practice.html#' + encodeURIComponent(id) + '">' + esc(IDX[id].k.name) + '</a><span class="code">' + esc(code(IDX[id].k)) + '</span></td><td class="num miss">' + n + '</td></tr>').join('') + '</tbody></table></div>' +
        '<div class="hint"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg><span>See the exact questions, with the right answers, in <button class="linkbtn" type="button" data-go="trouble">Trouble spots</button>.</span></div>'
        : '<div class="hint">Nothing to flag right now. Missed questions show up here so you know where to spend your next night.</div>') +
      '<div class="opportunity" style="margin-top:22px">' +
        (worst ? '<div class="op a"><span class="hand" style="font-size:22px">your biggest opportunity</span><h3>' + esc(worst.x.U.code) + ', Week ' + worst.w.week + ': ' + esc(worst.w.topic) + '</h3><p>Your lowest week right now, at level ' + worst.v + '. A couple of short sessions here moves your overall level the most.</p><a class="btn btn-small" href="diagnostic.html">See the action plan</a></div>'
          : '<div class="op a"><span class="hand" style="font-size:22px">get your levels</span><h3>Run a diagnostic</h3><p>Ten minutes gives every week a level, so Lamplight can point you at the weeks that matter most.</p><a class="btn btn-small" href="arena.html">Start the diagnostic</a></div>') +
        '<div class="op b"><span class="hand" style="font-size:22px;color:var(--muted)">' + (newMastered ? 'nice work' : 'keep going') + '</span><h3>' + totalMastered + ' skill' + (totalMastered === 1 ? '' : 's') + ' mastered' + (newMastered && range !== 'all' ? ', ' + newMastered + ' in ' + rangeWord() : '') + '.</h3><p>Your prizes and certificates are waiting.</p><a class="btn btn-small" href="awards.html">See my awards</a></div></div>' +
      '</section>';
  }

  /* ---------- USAGE ---------- */
  function usage() {
    const list = rows(), xs = subsInView().filter(x => list.some(r => IDX[r.s].x === x));
    if (!list.length) return '<div class="title"><h1>Usage</h1><span class="hand">when you actually study</span></div>' + empty('nothing yet', 'No questions answered in ' + rangeWord() + ' for this filter. Practise a little and your usage shows up here.');
    const nights = new Set(list.map(r => sod(r.t))).size, mins = minutes(list);
    const start = t0(), span = Math.round((today - start) / DAY) + 1, weekly = span > 42;
    const buckets = []; if (weekly) { for (let t = start; t <= today; t += 7 * DAY) buckets.push([t, Math.min(t + 7 * DAY, today + DAY)]); } else for (let t = start; t <= today; t += DAY) buckets.push([t, t + DAY]);
    const stacks = buckets.map(([a, b]) => xs.map(x => list.filter(r => r.t >= a && r.t < b && IDX[r.s].x === x).length));
    const max = Math.max(1, ...stacks.map(s => s.reduce((p, q) => p + q, 0)));
    const W = 1000, H = 300, Lm = 34, R = 8, T = 14, B = 28, bw = (W - Lm - R) / buckets.length;
    const top = Math.ceil(max / 4) * 4 || 4, y = v => T + (H - T - B) * (1 - v / top);
    let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Questions answered by ' + (weekly ? 'week' : 'day') + '">';
    [0, .5, 1].forEach(f => { const v = Math.round(top * f); s += '<line class="grid" x1="' + Lm + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="axis" x="' + (Lm - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
    const every = Math.ceil(buckets.length / 8);
    buckets.forEach(([a], i) => {
      let base = 0; const tot = stacks[i].reduce((p, q) => p + q, 0);
      stacks[i].forEach((v, j) => { if (!v) return; const y1 = y(base + v), y0 = y(base); s += '<rect x="' + (Lm + i * bw + bw * 0.15) + '" y="' + y1 + '" width="' + (bw * 0.7) + '" height="' + Math.max(1, y0 - y1) + '" rx="2" fill="' + xs[j].c + '"><title>' + (weekly ? 'Week of ' : '') + fmt(a) + ': ' + v + ' ' + esc(xs[j].code) + '</title></rect>'; base += v; });
      if (i % every === 0 || i === buckets.length - 1) s += '<text class="axis" x="' + (Lm + i * bw + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + (span <= 7 ? new Date(a).toLocaleDateString('en-AU', { weekday: 'short' }) : fmt(a)) + '</text>';
      if (tot && buckets.length <= 14) s += '<text class="end" x="' + (Lm + i * bw + bw / 2) + '" y="' + (y(tot) - 5) + '" text-anchor="middle" style="font-size:11px">' + tot + '</text>';
    });
    s += '</svg>';
    const parts = [['Morning', 5, 12], ['Afternoon', 12, 17], ['Evening', 17, 21], ['Late night', 21, 24], ['After midnight', 0, 5]];
    const pc = parts.map(p => list.filter(r => { const h = new Date(r.t).getHours(); return h >= p[1] && h < p[2]; }).length), pm = Math.max(1, ...pc);
    const bySub = xs.map(x => { const l = list.filter(r => IDX[r.s].x === x); return { x, n: l.length, m: minutes(l), acc: l.length ? Math.round(l.filter(r => r.ok).length / l.length * 100) : null, last: l.length ? l[l.length - 1].t : null }; }).filter(r => r.n);
    return '<div class="title"><h1>Usage</h1><span class="hand">when you actually study</span></div>' +
      '<section class="panel"><h2>At a glance</h2><p class="lead">Over ' + rangeWord() + '.</p><div class="kpis four">' +
        kpi('var(--hl-green)', IC.q, 'Questions', list.length.toLocaleString()) + kpi('var(--hl-blue)', IC.t, 'Time, roughly', hm(mins)) +
        kpi('var(--hl-pink)', IC.n, 'Nights studied', nights) + kpi('var(--hl-orange)', IC.s, 'Per night', Math.round(list.length / Math.max(1, nights))) + '</div></section>' +
      '<section class="panel"><div class="chartcard"><div class="ch-head"><h2>Questions by ' + (weekly ? 'week' : 'day') + '</h2>' + (xs.length > 1 ? '<div class="legend">' + xs.map(x => '<span><i style="background:' + x.c + '"></i>' + esc(x.code) + '</span>').join('') + '</div>' : '') + '</div>' + s + '</div></section>' +
      '<div class="two">' +
        '<section class="panel"><h2>Time of day</h2><p class="lead">When your questions get answered.</p><div class="hbars">' + parts.map((p, i) => '<div class="hb"><span>' + p[0] + '</span><div class="track"><i style="width:' + (pc[i] / pm * 100) + '%"></i></div><b>' + pc[i] + '</b></div>').join('') + '</div></section>' +
        '<section class="panel"><h2>By subject</h2><p class="lead">Accuracy is right first go.</p><div class="tblwrap" style="margin-top:0"><table class="compact"><thead><tr><th>Subject</th><th class="num">Qs</th><th class="num">Min</th><th class="num">Right</th><th class="num">Last</th></tr></thead><tbody>' +
          bySub.map(r => '<tr><td>' + subjCell(r.x) + '</td><td class="num">' + r.n + '</td><td class="num">' + r.m + '</td><td class="num">' + r.acc + '%</td><td class="num date">' + fmt(r.last) + '</td></tr>').join('') + '</tbody></table></div></section>' +
      '</div>';
  }

  /* ---------- TROUBLE SPOTS ---------- */
  function trouble() {
    const counts = {};
    if (range === 'all') Object.keys(PR).filter(inView).forEach(id => { const m = PR[id].missed || {}; Object.keys(m).forEach(q => { if (m[q] > 0) { counts[id] = counts[id] || {}; counts[id][q] = m[q]; } }); });
    else rows().filter(r => !r.ok && r.q != null).forEach(r => { counts[r.s] = counts[r.s] || {}; counts[r.s][r.q] = (counts[r.s][r.q] || 0) + 1; });
    const skills = Object.keys(counts).map(id => ({ id, qs: Object.entries(counts[id]).map(([q, n]) => ({ q: IDX[id].k.questions[+q], n })).filter(x => x.q).sort((a, b) => b.n - a.n) })).filter(s => s.qs.length)
      .map(s => Object.assign(s, { total: s.qs.reduce((a, b) => a + b.n, 0) })).sort((a, b) => (score(a.id) >= 100) - (score(b.id) >= 100) || b.total - a.total);
    const head = '<div class="title"><h1>Trouble spots</h1><span class="hand">the ones that keep tripping you up</span></div>';
    if (!skills.length) return head + empty('nothing tripping you up', range === 'all' ? 'When you miss a question, it lands here with the right answer and why, so you can fix it before the exam.' : 'No missed questions recorded in ' + rangeWord() + '. Try All time.');
    if (open == null) open = skills[0].id;
    return head + '<p class="lead" style="margin:-10px 0 22px;color:var(--ink-2)">' + skills.length + ' skill' + (skills.length === 1 ? '' : 's') + ' with missed questions over ' + rangeWord() + '. The skills you haven\'t mastered yet come first.</p>' +
      skills.map(s => { const x = IDX[s.id], isOpen = open === s.id, m = score(s.id) >= 100;
        return '<section class="tcard' + (isOpen ? ' open' : '') + '" style="--c:' + x.x.c + '"><button type="button" class="thead" data-open="' + esc(s.id) + '" aria-expanded="' + isOpen + '"><i></i><span><b>' + esc(x.k.name) + '</b><small>' + esc(code(x.k)) + ' · Week ' + x.w.week + ' · SmartScore ' + score(s.id) + (m ? ' · mastered now' : '') + '</small></span><span class="tn">' + s.total + '<small>missed</small></span></button>' +
          (isOpen ? '<div class="tbody">' + s.qs.map(o => '<div class="tq"><span class="times">Missed ' + o.n + ' time' + (o.n === 1 ? '' : 's') + '</span>' + qBlock(o.q) + '</div>').join('') + '<a class="btn btn-yellow btn-small" href="practice.html#' + encodeURIComponent(s.id) + '">Practise this skill</a></div>' : '') + '</section>'; }).join('');
  }

  /* ---------- SCORES ---------- */
  const band = s => s >= 100 ? 'b5' : s >= 80 ? 'b4' : s >= 60 ? 'b3' : s >= 30 ? 'b2' : s > 0 ? 'b1' : 'b0';
  function scores() {
    const every = subsInView(), started = x => x.U.weekList.some(w => w.skills.some(k => PR[k.id] && PR[k.id].answered));
    const xs = subj === 'all' && every.some(started) ? every.filter(started) : every, idle = every.filter(x => !xs.includes(x));
    if (!xs.length) return '<div class="title"><h1>Scores</h1></div>' + empty('no subjects yet', 'Add a subject to see its scores.');
    return '<div class="title"><h1>Scores</h1><span class="hand">every skill, every week</span></div>' +
      '<div class="legendbar"><span><i class="cell b0"></i>Not started</span><span><i class="cell b1"></i>1 to 29</span><span><i class="cell b2"></i>30 to 59</span><span><i class="cell b3"></i>60 to 79</span><span><i class="cell b4"></i>80 to 99</span><span><i class="cell b5"></i>100 mastered</span></div>' +
      xs.map(x => { const weeks = x.U.weekList.filter(w => wk === 'all' || w.week === +wk), all = weeks.flatMap(w => w.skills);
        const m = all.filter(k => score(k.id) >= 100).length, pf = all.filter(k => score(k.id) >= 80).length, st = all.filter(k => PR[k.id] && PR[k.id].answered).length;
        return '<section class="panel"><div class="ch-head" style="margin-bottom:6px"><h2>' + esc(x.U.name) + ' <span class="code" style="font-size:14px">' + esc(x.U.code) + '</span></h2><div class="legend"><span>' + m + ' mastered</span><span>' + pf + ' at 80+</span><span>' + st + ' of ' + all.length + ' started</span></div></div><div class="sgrid">' +
          weeks.map(w => '<div class="srow"><div class="sw"><b>Week ' + w.week + '</b><small>' + esc(w.topic) + '</small></div><div class="cells">' + w.skills.map(k => { const s = score(k.id); return '<a class="cell ' + band(s) + '" href="practice.html#' + encodeURIComponent(k.id) + '" title="' + esc(k.id.split('-')[1] + ' ' + k.name) + ': ' + s + '">' + (s >= 100 ? '★' : s || '') + '</a>'; }).join('') + '</div></div>').join('') + '</div></section>'; }).join('') +
      (idle.length ? '<div class="hint">Not started yet: ' + idle.map(x => '<button class="linkbtn" type="button" data-subj="' + esc(x.code) + '">' + esc(x.U.name) + '</button>').join(', ') + '. Pick one to see its full grid.</div>' : '');
  }

  /* ---------- QUESTIONS ---------- */
  function questions() {
    const list = rows().slice().reverse();
    const head = '<div class="title"><h1>Questions</h1><span class="hand">every one you\'ve answered</span></div>';
    if (!list.length) return head + empty('nothing yet', 'No questions answered in ' + rangeWord() + ' for this filter.');
    const shown = list.slice(0, qMore), noDetail = list.filter(r => r.q == null).length;
    return head + '<p class="lead" style="margin:-10px 0 18px;color:var(--ink-2)">' + list.length.toLocaleString() + ' answered over ' + rangeWord() + ', ' + list.filter(r => r.ok).length.toLocaleString() + ' right first go. Tap one to see the right answer.' + (noDetail ? ' Older answers, from before Lamplight kept the question, show the skill only.' : '') + '</p>' +
      '<div class="qlist">' + shown.map((r, i) => { const x = IDX[r.s], q = r.q != null ? x.k.questions[r.q] : null, key = r.t + '|' + r.s, isOpen = open === key;
        return '<div class="qrow' + (isOpen ? ' open' : '') + '"><button type="button" class="qhead" data-open="' + esc(key) + '"' + (q ? '' : ' disabled') + ' aria-expanded="' + isOpen + '"><span class="res ' + (r.ok ? 'ok' : 'no') + '">' + (r.ok ? 'Right' : 'Missed') + '</span><span class="qm"><b>' + esc(q ? qText(q) : x.k.name) + '</b><small>' + esc(code(x.k)) + (q ? ' · ' + esc(x.k.name) : '') + '</small></span><span class="when">' + new Date(r.t).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) + '</span></button>' +
          (isOpen && q ? '<div class="qbody">' + qBlock(q, true) + '</div>' : '') + '</div>'; }).join('') + '</div>' +
      (list.length > qMore ? '<div style="margin-top:16px"><button class="btn btn-small" type="button" data-more>Show 25 more</button></div>' : '');
  }

  /* ---------- PROGRESS ---------- */
  function progress() {
    const list = rows(), ids = [...new Set(list.map(r => r.s))];
    const head = '<div class="title"><h1>Progress</h1><span class="hand">how far each skill has moved</span></div>';
    if (!ids.length) return head + empty('nothing yet', 'No skills practised in ' + rangeWord() + ' for this filter.');
    const start = t0();
    const items = ids.map(id => { const from = range === 'all' ? 0 : scoreBefore(id, start), to = score(id), l = list.filter(r => r.s === id); return { id, x: IDX[id], from, to, d: to - from, n: l.length, m: minutes(l) }; }).sort((a, b) => b.d - a.d || b.to - a.to);
    const up = items.filter(i => i.d > 0).length, pts = items.reduce((a, i) => a + Math.max(0, i.d), 0), newly = items.filter(i => i.to >= 100 && i.from < 100).length;
    return head + '<section class="panel"><div class="kpis">' + kpi('var(--hl-green)', IC.s, 'Skills that moved up', up) + kpi('var(--hl-blue)', IC.q, 'SmartScore points gained', pts) + kpi('var(--hl-yellow)', trophy.replace('class="ico" ', '').replace('width="16" height="16"', 'width="22" height="22"'), 'Newly mastered', newly) + '</div></section>' +
      '<section class="panel"><h2>Skill by skill</h2><p class="lead">Where each skill started ' + (range === 'all' ? '(at 0)' : 'at the beginning of ' + rangeWord()) + ', and where it is now.</p><div class="plist">' +
        items.map(i => '<a class="prow" href="practice.html#' + encodeURIComponent(i.id) + '" style="--c:' + i.x.x.c + '"><span class="pn"><b>' + esc(i.x.k.name) + '</b><small>' + esc(code(i.x.k)) + ' · ' + i.n + ' question' + (i.n === 1 ? '' : 's') + ' · ' + i.m + ' min</small></span>' +
          '<span class="ptrack"><i class="pfrom" style="width:' + Math.min(i.from, i.to) + '%"></i><i class="pgain' + (i.d < 0 ? ' lost' : '') + '" style="left:' + Math.min(i.from, i.to) + '%;width:' + Math.abs(i.d) + '%"></i></span>' +
          '<span class="pd ' + (i.d > 0 ? 'up' : i.d < 0 ? 'down' : '') + '">' + i.from + ' to ' + i.to + (i.to >= 100 ? trophy : '') + '</span></a>').join('') + '</div></section>';
  }

  const REPORTS = { summary, usage, trouble, scores, questions, progress };
  function render() {
    if (!REPORTS[tab]) tab = 'summary';
    document.querySelectorAll('.rtab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
    filters();
    $('#report').innerHTML = REPORTS[tab]();
    if (tab === 'summary') wireLine();
  }

  $('#rtabs').addEventListener('click', e => { const b = e.target.closest('.rtab'); if (b) { tab = b.dataset.t; open = null; qMore = 25; history.replaceState(null, '', '#' + tab); render(); } });
  $('#fSubject').addEventListener('change', e => { subj = e.target.value; wk = 'all'; open = null; render(); });
  $('#fWeeks').addEventListener('change', e => { wk = e.target.value; open = null; render(); });
  $('#fRange').addEventListener('change', e => { range = e.target.value; open = null; render(); });
  document.addEventListener('click', e => {
    const s = e.target.closest('[data-sort]'); if (s) { const k = s.dataset.sort; sort = { k, dir: sort.k === k ? -sort.dir : (k === 'date' ? -1 : 1) }; render(); return; }
    if (e.target.closest('[data-all]')) { showAll = !showAll; render(); return; }
    const g = e.target.closest('[data-go]'); if (g) { tab = g.dataset.go; open = null; history.replaceState(null, '', '#' + tab); render(); window.scrollTo({ top: 0 }); return; }
    const o = e.target.closest('[data-open]'); if (o) { open = open === o.dataset.open ? '' : o.dataset.open; render(); return; }
    if (e.target.closest('[data-more]')) { qMore += 25; render(); return; }
    const sj = e.target.closest('[data-subj]'); if (sj) { subj = sj.dataset.subj; wk = 'all'; render(); }
  });
  const av = document.querySelector('a.avatar'); const first = String(profile.name || '').trim()[0]; if (av && first) av.textContent = first.toUpperCase();
  $('#lights').addEventListener('click', () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark');
  });
  render();
})();
</script>
<script src="js/tour.js"></script>
</body>
</html>
