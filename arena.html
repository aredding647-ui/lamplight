<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnostic Arena · Lamplight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/lamplight.css">
<style>
  :root { --calm-bg: #F1EFE9; --calm-line: #DEDAD0; --calm-accent: #5B7A6B; --calm-sel: #5A7895; --calm-glow: rgba(214, 190, 110, .20); }
  :root[data-theme="dark"] { --calm-bg: #1D2023; --calm-line: #34383C; --calm-accent: #92B5A4; --calm-sel: #8EA9C6; --calm-glow: rgba(214, 190, 110, .10); }
  .btn-calm { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-calm:hover { background: var(--ink-2); }
  .navlinks a[aria-current="page"] { background: var(--hl-yellow); color: #141414; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--ink); background: var(--hl-pink); color: #141414; display: grid; place-items: center; font: 800 17px var(--font-display); text-decoration: none; box-shadow: 0 3px 0 var(--shadow); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
  .icon-btn:hover { border-color: var(--ink); }

  .stage { position: relative; margin-top: 22px; }

  /* the strip above the question: see your levels, lamp, subject picker */
  .astrip { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 10px 16px; border: 2.5px solid var(--ink); border-bottom: 0; border-radius: 20px 20px 0 0; background: var(--calm-bg); color: var(--ink); position: relative; z-index: 3; }
  .astrip a.levels { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14.5px; justify-self: start; padding: 6px 8px; border-radius: 10px; }
  .astrip a.levels:hover { background: var(--calm-line); }
  .astrip .mark { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .astrip .mark i { width: 4px; height: 4px; border-radius: 99px; background: var(--muted); opacity: .5; }
  .pick { justify-self: end; position: relative; }
  .pick > button { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--ink); font: 700 14.5px var(--font-body); cursor: pointer; padding: 6px 8px; border-radius: 10px; }
  .pick > button:hover { background: var(--calm-line); }
  .pick > button svg.chev { transition: transform .2s; }
  .pick > button[aria-expanded="true"] svg.chev { transform: rotate(180deg); }
  .pick ul { position: absolute; right: 0; top: calc(100% + 8px); list-style: none; margin: 0; padding: 6px; min-width: 280px; background: var(--card); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--shadow); z-index: 20; }
  .pick li button { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; padding: 10px 10px; border: 0; background: none; border-radius: 10px; font: 600 14.5px var(--font-body); color: var(--ink); cursor: pointer; }
  .pick li button:hover { background: var(--paper-2); }
  .pick li button[aria-checked="true"] { background: var(--calm-bg); color: var(--ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--calm-accent); }
  .pick li i { width: 12px; height: 12px; border-radius: 4px; border: 1.5px solid var(--ink); flex: none; }
  .pick li small { margin-left: auto; font: 700 10.5px var(--font-mono); color: var(--muted); }
  .pick li button[aria-checked="true"] small { color: var(--muted); }
  .pick li.sep { height: 1.5px; background: var(--line); margin: 6px 4px; }

  /* the question card */
  .acard { position: relative; background: var(--card); border: 2.5px solid var(--ink); border-radius: 0 0 20px 20px; box-shadow: 0 8px 0 var(--shadow); padding: 40px 48px 22px; min-height: 420px; display: flex; flex-direction: column; }
  @media (max-width: 700px) { .acard { padding: 26px 18px 18px; } }
  .qbody { max-width: 780px; flex: 1; }
  .qbody.enter { animation: slidein .35s cubic-bezier(.2,.8,.3,1); }
  @keyframes slidein { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  .instr { color: var(--calm-accent); font-size: 18.5px; line-height: 1.6; font-weight: 600; margin: 0 0 18px; }
  .passage { font-size: 17px; line-height: 1.85; margin: 0 0 22px 24px; padding-left: 16px; border-left: 3px solid var(--line); color: var(--ink); }
  .opts { display: grid; gap: 12px; max-width: 640px; margin-left: 24px; }
  @media (max-width: 700px) { .opts, .passage { margin-left: 0; } }
  .opt { text-align: left; padding: 15px 18px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); font: 500 17px/1.45 var(--font-body); cursor: pointer; transition: border-color .12s, background .12s; }
  .opt:hover { border-color: var(--ink-2); }
  .opt[aria-pressed="true"] { border-color: var(--calm-sel); background: color-mix(in srgb, var(--calm-sel) 12%, var(--card)); box-shadow: inset 0 0 0 1px var(--calm-sel); }
  .gapline { font-size: 18px; line-height: 2.3; margin-left: 24px; }
  .typein { font: 600 17px var(--font-body); padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); width: min(100%, 420px); }
  .gapline .typein { width: 220px; padding: 5px 10px; }
  .typein:focus { outline: none; border-color: var(--calm-sel); }
  .typewrap { margin-left: 24px; }
  @media (max-width: 700px) { .gapline, .typewrap { margin-left: 0; } }
  .afoot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 30px; }
  .afoot .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 2px 0 var(--shadow); }
  .dunno { background: none; border: 0; color: var(--muted); font: 600 14px var(--font-body); cursor: pointer; padding: 6px 2px; opacity: .8; }
  .dunno:hover { color: var(--ink); opacity: 1; text-decoration: underline; }

  /* scratchpad pencil, outside the card like a tool on the desk */
  .pencil { position: absolute; right: -62px; top: 74px; width: 46px; height: 46px; border-radius: 14px; border: 2px solid var(--ink); background: var(--card); display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 0 var(--shadow); color: var(--calm-sel); z-index: 4; }
  .pencil[aria-pressed="true"] { background: var(--calm-bg); color: var(--calm-sel); }
  @media (max-width: 1300px) { .pencil { right: 14px; top: 64px; } }
  .pad { position: absolute; inset: 0; z-index: 3; border-radius: 0 0 20px 20px; overflow: hidden; }
  .pad canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .pad .padtools { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 8px; }
  .pad .padtools button { font: 700 13px var(--font-body); padding: 8px 12px; border-radius: 10px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; }
  .pad .padnote { position: absolute; left: 16px; bottom: 16px; font: 600 20px var(--font-hand); color: var(--muted); pointer-events: none; }

  .empty { text-align: center; padding: 60px 20px; }
  .empty h2 { font-size: 34px; letter-spacing: -0.03em; }
  .empty p { color: var(--ink-2); }
  .pagefoot { margin-top: 70px; border-top: 2px solid var(--ink); padding-block: 24px 40px; color: var(--muted); font-size: 14px; }
  .reveal { display: flex; align-items: center; gap: 14px; padding: 10px 72px 10px 18px; background: var(--paper-2); border-left: 2.5px solid var(--ink); border-right: 2.5px solid var(--ink); font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; }
  .reveal:empty { display: none; }
  .reveal .rbar { flex: 1; min-width: 120px; height: 8px; border-radius: 99px; background: var(--card); overflow: hidden; }
  .reveal .rbar i { display: block; height: 100%; background: var(--good); transition: width .5s ease; }
  .done { text-align: center; padding: 10px 0 6px; display: grid; justify-items: center; gap: 12px; }
  .done .hand { font-size: 30px; color: var(--muted); transform: rotate(-2deg); }
  .done h2 { font-size: clamp(30px, 5vw, 46px); letter-spacing: -0.04em; max-width: 16em; }
  .done p { margin: 0; max-width: 32em; color: var(--ink-2); font-size: 16.5px; }
  .dstats { display: flex; gap: 28px; margin-top: 6px; }
  .dstats b { display: block; font: 800 34px/1 var(--font-display); letter-spacing: -0.03em; }
  .dstats small { color: var(--muted); font-weight: 600; font-size: 13px; }
  .dlv { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; width: min(100%, 420px); }
  .dlv li { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--paper); text-align: left; font-weight: 600; font-size: 14.5px; }
  .dlv li i { width: 12px; height: 12px; border-radius: 4px; background: var(--c); border: 1.5px solid var(--ink); }
  .dlv li b { font: 800 20px var(--font-display); }
  .dlv li em { font: 700 12.5px var(--font-mono); font-style: normal; } .dlv li em.up { color: var(--good); } .dlv li em.down { color: var(--bad); }
  .dbtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
</style>
<script src="js/config.js"></script>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const G = window.LamplightDiag, esc = window.Lamplight.esc;
  const card = $('#acard');
  let scope = 'current', S = null, Q = null, chosen = null;

  function scopeCodes() {
    const subs = G.subjects();
    if (scope === 'current') return subs.filter(s => !s.done).map(s => s.U.code);
    if (scope === 'everything') return subs.map(s => s.U.code);
    return [scope];
  }
  function scopeLabel() {
    if (scope === 'current') return 'All subjects';
    if (scope === 'everything') return 'Everything, including T1';
    const s = G.subjectFor(scope); return s ? s.U.name : 'Subject';
  }
  function renderPicker() {
    const subs = G.subjects(), cur = subs.filter(s => !s.done), done = subs.filter(s => s.done);
    const row = (val, label, colour, tag) => '<li><button type="button" role="option" data-scope="' + val + '" aria-checked="' + (scope === val) + '">' + (colour ? '<i style="background:' + colour + '"></i>' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg>') + esc(label) + (tag ? '<small>' + tag + '</small>' : '') + '</button></li>';
    $('#pickList').innerHTML = row('current', 'All subjects', null, 'THIS TRI') + (done.length ? row('everything', 'Everything, including T1', null, '') : '') + '<li class="sep"></li>' +
      cur.map(s => row(s.U.code, s.U.name, s.colour, s.U.code)).join('') + done.map(s => row(s.U.code, s.U.name, s.colour, 'T1')).join('');
    $('#pickLbl').textContent = scopeLabel();
  }

  function start() {
    const codes = scopeCodes();
    if (!codes.length) { card.innerHTML = '<div class="empty"><h2>Add a subject first</h2><p>The diagnostic builds its questions from the notes you upload.</p><a class="btn btn-calm" href="subject.html">Go to your subjects</a></div>'; return; }
    S = new G.Session(codes); session = { n: 0, t0: Date.now(), wasRevealed: hidden(codes) === 0, done: false, before: levelsNow(codes) }; ask();
  }

  /* ---------- knowing when there's enough to go on ---------- */
  let session = null;
  function hidden(codes) { let n = 0; codes.forEach(c => { const s = G.subjectFor(c); if (s) s.U.weekList.forEach(w => { const L = G.weekLevel(c, w.week); if (L.v == null || L.n < 2) n++; }); }); return n; }
  function total(codes) { return codes.reduce((t, c) => { const s = G.subjectFor(c); return t + (s ? s.U.weekList.length : 0); }, 0); }
  function levelsNow(codes) { const o = {}; codes.forEach(c => { const s = G.subjectFor(c); if (!s) return; const v = s.U.weekList.map(w => G.weekLevel(c, w.week).v).filter(x => x != null); o[c] = v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; }); return o; }
  function paintReveal() {
    const codes = scopeCodes(), all = total(codes), left = hidden(codes), el = $('#reveal'); if (!el || !all) return;
    const pct = Math.round((all - left) / all * 100);
    el.innerHTML = '<span>' + (left ? 'Levels revealed: <b>' + (all - left) + ' of ' + all + '</b> weeks' : 'All <b>' + all + '</b> week levels revealed') + '</span><div class="rbar"><i style="width:' + pct + '%"></i></div>';
  }
  function after() {
    session.n++;
    const codes = scopeCodes();
    const ready = hidden(codes) === 0 && (!session.wasRevealed || session.n >= 10);
    if (ready && !session.done) { session.done = true; paintReveal(); return showDone(codes); }
    ask();
  }
  function showDone(codes) {
    Q = null;
    const mins = Math.max(1, Math.round((Date.now() - session.t0) / 60000)), now = levelsNow(codes);
    const rows = codes.map(c => { const s = G.subjectFor(c), b = session.before[c], v = now[c]; if (!s || v == null) return '';
      const d = b != null ? v - b : null;
      return '<li style="--c:' + s.colour + '"><i></i><span>' + esc(s.U.name) + '</span><b>' + v + '</b>' + (d ? '<em class="' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + d + '</em>' : '') + '</li>'; }).join('');
    card.innerHTML = '<div class="done enter"><span class="hand">' + (session.wasRevealed ? 'levels updated' : 'well done!') + '</span>' +
      '<h2>' + (session.wasRevealed ? 'Your levels are up to date.' : 'You\'ve revealed all your levels!') + '</h2>' +
      '<p>Now it\'s time to learn. Practise the skills picked for you, and your levels will keep climbing. You can come back to the arena any time.</p>' +
      '<div class="dstats"><div><b>' + session.n + '</b><small>questions</small></div><div><b>' + mins + '</b><small>minute' + (mins === 1 ? '' : 's') + '</small></div></div>' +
      (rows ? '<ul class="dlv">' + rows + '</ul>' : '') +
      '<div class="dbtns"><a class="btn btn-yellow" href="recommendations.html">Start learning</a><a class="btn" href="diagnostic.html">See my levels</a></div>' +
      '<button type="button" class="dunno" id="more">Keep answering questions ›</button></div>';
  }

  function ask() {
    paintReveal();
    const it = S.next(); Q = it.q; chosen = null;
    let h = '<div class="qbody enter">';
    if (Q.type === 'fill_gap' || (Q.type === 'type_answer' && /_{3,}/.test(Q.prompt))) {
      const gapText = Q.type === 'fill_gap' ? Q.text : Q.prompt, parts = esc(gapText).split(/_{3,}/);
      h += '<p class="instr">' + (Q.type === 'fill_gap' ? esc(Q.prompt) : 'Complete the sentence.') + '</p><div class="gapline">' + parts[0] + '<input class="typein" id="aIn" autocomplete="off" aria-label="Your answer">' + (parts[1] || '') + '</div>';
    } else if (Q.type === 'type_answer') {
      h += '<p class="instr">' + esc(Q.prompt) + '</p><div class="typewrap"><input class="typein" id="aIn" autocomplete="off" aria-label="Your answer"></div>';
    } else {
      h += '<p class="instr">' + esc(Q.prompt) + '</p>';
      if (Q.passage) h += '<div class="passage">' + esc(Q.passage) + '</div>';
      h += '<div class="opts" role="group" aria-label="Choices">' + G.shuffle(Q.options.map((_, i) => i)).map(i => '<button class="opt" type="button" data-opt="' + i + '" aria-pressed="false">' + esc(Q.options[i]) + '</button>').join('') + '</div>';
    }
    h += '</div><div class="afoot"><button class="btn btn-calm" type="button" id="submit" disabled>Submit</button><button class="dunno" type="button" id="dunno">I don\'t know this yet ›</button></div>';
    card.innerHTML = h + (padOn ? padHTML() : '');
    if (padOn) initPad();
    const inp = $('#aIn');
    if (inp) {
      inp.addEventListener('input', () => { $('#submit').disabled = !inp.value.trim(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) { e.preventDefault(); submit(); } });
      if (!padOn) inp.focus({ preventScroll: true });
    }
  }
  function submit() {
    let r;
    if (Q.type === 'fill_gap' || Q.type === 'type_answer') { const v = $('#aIn').value; if (!v.trim()) return; r = (Q.answers || []).some(a => G.norm(a) === G.norm(v)) ? 1 : 0; }
    else { if (chosen == null) return; r = chosen === Q.answer ? 1 : 0; }
    S.answer(r); after();
  }

  /* scratchpad */
  let padOn = false, ink = null;
  const padHTML = () => '<div class="pad" id="pad"><canvas id="padc"></canvas><span class="padnote">scratchpad</span><div class="padtools"><button type="button" id="padClear">Clear</button><button type="button" id="padClose">Done</button></div></div>';
  function initPad() {
    const c = $('#padc'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr;
    const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = 2.6;
    x.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--s1').trim() || '#2F7FC1';
    if (ink) { const img = new Image(); img.onload = () => x.drawImage(img, 0, 0, r.width, r.height); img.src = ink; }
    let down = false;
    const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    c.addEventListener('pointerdown', e => { down = true; c.setPointerCapture(e.pointerId); const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); });
    c.addEventListener('pointermove', e => { if (!down) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); });
    c.addEventListener('pointerup', () => { down = false; ink = c.toDataURL(); });
    $('#padClear').addEventListener('click', () => { x.clearRect(0, 0, c.width, c.height); ink = null; });
    $('#padClose').addEventListener('click', () => togglePad(false));
  }
  function togglePad(on) {
    padOn = on; $('#pencil').setAttribute('aria-pressed', String(on));
    const p = $('#pad'); if (p) p.remove();
    if (on) { card.insertAdjacentHTML('beforeend', padHTML()); initPad(); }
  }

  document.addEventListener('click', e => {
    const t = e.target;
    const o = t.closest('[data-opt]');
    if (o) { chosen = +o.dataset.opt; card.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', String(b === o))); $('#submit').disabled = false; return; }
    if (t.closest('#submit')) { submit(); return; }
    if (t.closest('#dunno')) { S.answer(-1); after(); return; }
    if (t.closest('#more')) { ask(); return; }
    if (t.closest('#pencil')) { togglePad(!padOn); return; }
    if (t.closest('#pickBtn')) { const l = $('#pickList'); l.hidden = !l.hidden; $('#pickBtn').setAttribute('aria-expanded', String(!l.hidden)); return; }
    const sc = t.closest('[data-scope]');
    if (sc) { scope = sc.dataset.scope; $('#pickList').hidden = true; $('#pickBtn').setAttribute('aria-expanded', 'false'); renderPicker(); start(); return; }
    if (!t.closest('.pick')) { $('#pickList').hidden = true; $('#pickBtn').setAttribute('aria-expanded', 'false'); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { $('#pickList').hidden = true; $('#pickBtn').setAttribute('aria-expanded', 'false'); if (padOn) togglePad(false); return; }
    if (e.target.matches('input, textarea') || !Q || !Q.options || padOn) return;
    const n = '1234'.indexOf(e.key) > -1 ? '1234'.indexOf(e.key) : 'abcd'.indexOf(e.key.toLowerCase());
    const btns = card.querySelectorAll('.opt');
    if (n > -1 && btns[n]) { btns[n].click(); return; }
    if (e.key === 'Enter' && chosen != null) { e.preventDefault(); submit(); }
  });
  $('#lights').addEventListener('click', () => { const d = document.documentElement.getAttribute('data-theme') === 'dark'; if (d) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark'); });

  const hs = decodeURIComponent(location.hash.slice(1)); if (hs) scope = hs;
  renderPicker(); start();
})();
</script>
<script src="js/tour.js"></script>
</body>
</html>
