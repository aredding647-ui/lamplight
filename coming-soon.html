<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming next · Lamplight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/lamplight.css">
<style>
  .navlinks a[aria-current="page"] { background: var(--hl-yellow); color: #141414; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--ink); background: var(--hl-pink); color: #141414; display: grid; place-items: center; font: 800 17px var(--font-display); text-decoration: none; box-shadow: 0 3px 0 var(--shadow); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
  .soon { margin-top: 40px; background: var(--card); border: 2.5px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--shadow); padding: 44px 40px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: center; }
  @media (max-width: 820px) { .soon { grid-template-columns: 1fr; padding: 28px 22px; } }
  .soon .hand { font-size: 28px; color: var(--muted); transform: rotate(-2deg); display: inline-block; }
  .soon h1 { font-size: clamp(48px, 7vw, 96px); letter-spacing: -0.045em; margin: 6px 0 0; }
  .soon p { font-size: 18.5px; color: var(--ink-2); max-width: 30em; margin: 18px 0 0; }
  .soon ul { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .soon li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
  .soon li::before { content: ""; flex: none; width: 18px; height: 18px; border-radius: 6px; border: 2px dashed var(--ink); margin-top: 3px; }
  .soon .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .sketch { aspect-ratio: 4 / 3; border: 2.5px dashed var(--line); border-radius: 22px; background: var(--paper); display: grid; place-items: center; position: relative; overflow: hidden; }
  .sketch svg { width: 70%; height: auto; }
  .sketch .stamp { position: absolute; top: 16px; right: 16px; font: 800 15px var(--font-display); color: var(--bad); border: 3px solid var(--bad); border-radius: 9px; padding: 4px 10px; transform: rotate(8deg); background: var(--card); }
  .pagefoot { margin-top: 80px; border-top: 2px solid var(--ink); padding-block: 24px 40px; color: var(--muted); font-size: 14px; }
</style>
<script src="js/config.js"></script>
<script src="js/sync.js"></script>
<script src="js/menu.js"></script>
</head>
<body class="app">

<header class="topbar">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="index.html" aria-label="Lamplight home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 14 16 4l8 10Z" fill="var(--hl-yellow)" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 17 5 29h22l-6-12Z" fill="var(--hl-yellow)" opacity=".45"/><circle cx="16" cy="15.5" r="2" fill="var(--ink)"/></svg>
        Lamplight
      </a>
      <nav class="navlinks" aria-label="Main">
        <a href="dashboard.html" data-nav="home">Home</a>
        <a href="subject.html" data-nav="learning">Learning</a>
        <a href="diagnostic.html">Diagnostic</a>
        <a href="analytics.html">Analytics</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" type="button" id="lights" aria-label="Turn lights off" title="Lights off">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        </button>
        <a class="avatar" href="account.html" aria-label="Your account">S</a>
      </div>
    </div>
  </div>
</header>
<div class="subnav" id="subnav" data-current=""></div>

<main class="wrap">
  <section class="soon">
    <div>
      <span class="hand">coming next</span>
      <h1 id="t">Dashboard</h1>
      <p id="d"></p>
      <ul id="l"></ul>
      <div class="actions">
        <a class="btn btn-yellow" href="recommendations.html">Go to For you</a>
        <a class="btn" href="subject.html">Go to my subject</a>
      </div>
    </div>
    <div class="sketch" aria-hidden="true">
      <span class="stamp">NOT BUILT YET</span>
      <svg viewBox="0 0 200 150" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="20" y="16" width="160" height="118" rx="10"/><path d="M20 40h160"/><circle cx="34" cy="28" r="3"/><circle cx="46" cy="28" r="3"/>
        <path d="M38 62h60M38 78h90M38 94h44"/><rect x="118" y="86" width="44" height="30" rx="6"/>
      </svg>
    </div>
  </section>
</main>

<footer class="pagefoot"><div class="wrap">This page is a placeholder in the prototype. Use the Pages button to jump anywhere.</div></footer>

<script src="js/account.js"></script>
<script src="js/subnav.js"></script>
<script>
(() => {
  const P = {
    dashboard: { t: 'Dashboard', sub: '', nav: 'dashboard', d: 'Your home once you\'re signed in, like "My IXL". Everything for tonight in one place.',
      l: ['Tonight\'s three skills and your nightly goal', 'Recent skills and your streak', 'This week: questions, minutes and skills', 'Your latest award and diagnostic level'] },
    practice: { t: 'Practice', sub: '', nav: 'learning', d: 'Where you actually answer questions, one at a time, in every question type.',
      l: ['SmartScore out of 100, questions answered and a timer', 'Learn with an example before you start', 'A full explanation after every wrong answer', 'All fourteen question types, from matching to case studies'] },
    'skill-plans': { t: 'Skill plans', sub: 'plans', nav: 'learning', d: 'Pick the weeks and skills for an exam or assignment and turn them into a plan.',
      l: ['Choose a subject and the weeks it covers', 'Set the exam or due date', 'A day-by-day plan that fits your nights', 'Progress through the plan at a glance'] },
    awards: { t: 'Awards', sub: 'awards', nav: 'learning', d: 'A board of hidden prizes that you uncover as you practise, plus certificates to keep.',
      l: ['A prize board for each subject', 'Milestones for questions, time and mastered skills', 'Certificates you can download', 'Your streak record'] },
    account: { t: 'Account', sub: '', nav: '', d: 'Your profile and settings.',
      l: ['Name, uni and course', 'Nightly goal and reminders', 'Lights off by default after a set time', 'Manage your subjects and uploads'] }
  };
  function show() {
    const key = location.hash.slice(1) || 'dashboard', p = P[key] || P.dashboard;
    document.getElementById('t').textContent = p.t;
    document.getElementById('d').textContent = p.d;
    document.getElementById('l').innerHTML = p.l.map(x => '<li>' + x + '</li>').join('');
    document.title = p.t + ' · Lamplight';
    document.querySelectorAll('.navlinks a').forEach(a => a.toggleAttribute('aria-current', a.dataset.nav === p.nav && !!p.nav));
    document.querySelectorAll('.navlinks a[aria-current]').forEach(a => a.setAttribute('aria-current', 'page'));
    const sn = document.getElementById('subnav');
    sn.hidden = !p.sub && key !== 'practice';
    sn.setAttribute('data-current', p.sub);
    window.dispatchEvent(new Event('lamplight:subjects'));
  }
  window.addEventListener('hashchange', show);
  show();
  document.getElementById('lights').addEventListener('click', () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark');
  });
})();
</script>
<script src="js/tour.js"></script>
</body>
</html>
